version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
  
  payment-service:
    build: .
    ports:
      - "8003:8003"
    environment:
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8003"
