version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:6
    container_name: flight-search-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: flight-search-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # RabbitMQ (for Celery)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flight-search-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Flight Search Service
  flight-search:
    build: .
    container_name: flight-search-service
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - MONGODB_URL=mongodb://admin:secret@mongodb:27017
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=amqp://admin:secret@rabbitmq:5672
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_MOCK_PROVIDER=True
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # Celery Worker
  celery-worker:
    build: .
    container_name: flight-search-celery-worker
    environment:
      - ENVIRONMENT=development
      - MONGODB_URL=mongodb://admin:secret@mongodb:27017
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=amqp://admin:secret@rabbitmq:5672
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker -l info

  # Celery Beat (scheduler)
  celery-beat:
    build: .
    container_name: flight-search-celery-beat
    environment:
      - ENVIRONMENT=development
      - MONGODB_URL=mongodb://admin:secret@mongodb:27017
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=amqp://admin:secret@rabbitmq:5672
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat -l info

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  default:
    name: flighthub-network
