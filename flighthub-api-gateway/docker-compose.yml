version: '3.8'

services:
  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: flighthub-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # API Gateway
  api-gateway:
    build: .
    container_name: flighthub-api-gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - REDIS_URL=redis://redis:6379
      - FLIGHT_SEARCH_URL=http://host.docker.internal:8001
      - BOOKING_SERVICE_URL=http://host.docker.internal:8002
      - PAYMENT_SERVICE_URL=http://host.docker.internal:8003
      - NOTIFICATION_SERVICE_URL=http://host.docker.internal:8004
      - USER_SERVICE_URL=http://host.docker.internal:8005
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis_data:

networks:
  default:
    name: flighthub-network
